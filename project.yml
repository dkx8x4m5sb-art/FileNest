name: FileNest

options:
  bundleIdPrefix: com.filenest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    from: 4.9.0

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"

targets:
  FileNest:
    type: application
    platform: iOS
    sources:
      - path: FileNest
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: SWCompression
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        INFOPLIST_FILE: FileNest/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.filenest.app
        PRODUCT_NAME: FileNest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: FileNest/FileNest-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/vendor/include
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - $(inherited)
          - -L$(SRCROOT)/vendor/lib
          - -larchive
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - $(inherited)
          - -L$(SRCROOT)/vendor/lib-sim
          - -larchive

  FileNestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FileNestTests
    dependencies:
      - target: FileNest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filenest.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/vendor/include
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  FileNest:
    build:
      targets:
        FileNest: all
        FileNestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FileNestTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
