name: FileNest

options:
  bundleIdPrefix: com.filenest
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FileNest:
    type: application
    platform: iOS
    sources:
      - path: FileNest
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: FileNest/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.filenest.app
        PRODUCT_NAME: FileNest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_EMIT_LOC_STRINGS: "NO"

schemes:
  FileNest:
    build:
      targets:
        FileNest: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
