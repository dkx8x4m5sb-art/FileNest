name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (Xcode 27 / iOS 27 SDK)
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build libarchive for iOS (device + simulator)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libarchive/libarchive.git /tmp/la

          build_slice () {
            local sdk="$1"
            local outdir="$2"
            local sysroot
            sysroot=$(xcrun --sdk "$sdk" --show-sdk-path)
            cmake -B "/tmp/la-build-$sdk" -S /tmp/la -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
              -DCMAKE_OSX_SYSROOT="$sysroot" \
              -DCMAKE_FIND_ROOT_PATH="$sysroot" \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DENABLE_TEST=OFF \
              -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF -DENABLE_UNZIP=OFF \
              -DENABLE_ACL=OFF -DENABLE_XATTR=OFF \
              -DENABLE_OPENSSL=OFF -DENABLE_LIBXML2=OFF -DENABLE_EXPAT=OFF \
              -DENABLE_ZLIB=ON -DENABLE_BZip2=OFF -DENABLE_LZMA=OFF \
              -DENABLE_ZSTD=OFF -DENABLE_LZ4=OFF
            cmake --build "/tmp/la-build-$sdk" --target archive_static
            mkdir -p "$outdir"
            cp "/tmp/la-build-$sdk/libarchive/libarchive.a" "$outdir/"
            lipo -info "$outdir/libarchive.a"
          }

          build_slice iphoneos vendor/lib
          build_slice iphonesimulator vendor/lib-sim

          mkdir -p vendor/include
          cp /tmp/la/libarchive/*.h vendor/include/ 2>/dev/null || true
          cp /tmp/la-build-iphoneos/config.h vendor/include/
          echo "headers: $(ls vendor/include | wc -l)"

      - name: Create test fixtures
        run: |
          set -euo pipefail
          rm -rf /tmp/fx && mkdir -p /tmp/fx/sub
          printf 'hello filenest\n' > /tmp/fx/hello.txt
          printf '中文内容测试\n' > "/tmp/fx/中文名.txt"
          printf 'nested\n' > /tmp/fx/sub/nested.txt
          mkdir -p FileNestTests/Fixtures
          (cd /tmp/fx && zip -qr "$GITHUB_WORKSPACE/FileNestTests/Fixtures/sample.zip" hello.txt "中文名.txt" sub)
          tar -czf FileNestTests/Fixtures/sample.tar.gz -C /tmp/fx hello.txt
          ls -la FileNestTests/Fixtures

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project FileNest.xcodeproj \
            -scheme FileNest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      - name: Run unit tests
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl list devices available | head -15
          xcodebuild test \
            -project FileNest.xcodeproj \
            -scheme FileNest \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee test.log | tail -60

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7

      - name: Package into IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/FileNest.app"
          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found"
            find build/Build/Products -maxdepth 2 -print
            exit 1
          fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FileNest-unsigned.ipa Payload
          ls -lh FileNest-unsigned.ipa

      - name: Verify unsigned
        run: |
          codesign -dv Payload/FileNest.app 2>&1 || echo "no signature present (expected)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-unsigned-ipa
          path: FileNest-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
